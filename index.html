<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Generate original 3D environments from collected map studies."
    />
    <meta name="theme-color" content="#111716" />
    <title>Map Generator</title>
  </head>
  <body>
    <main class="app">
      <canvas id="world-canvas" aria-label="Interactive 3D map preview"></canvas>
      <section class="controls" aria-label="Map generator">
        <h1>Map generator</h1>
        <label for="map-select">Reference map</label>
        <select id="map-select" disabled>
          <option>Loading maps…</option>
        </select>
        <button id="generate-world" type="button" disabled>Generate</button>
        <p id="data-status" role="status" aria-live="polite">Loading map data…</p>
      </section>
      <div class="map-name" id="map-name" aria-live="polite"></div>
      <div class="loading-state" id="loading-state" role="status" hidden>
        Generating…
      </div>
      <div class="error" id="error-message" role="alert" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
